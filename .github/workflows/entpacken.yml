name: Projekt entpacken
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Entpacken und aufräumen
        run: |
          set -e
          test -f watermap-v7-release.zip
          mkdir /tmp/neu
          unzip -q watermap-v7-release.zip -d /tmp/neu
          rm -rf /tmp/neu/watermap/.github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/neu/watermap/. .
          git config user.name "watermap-bot"
          git config user.email "watermap-bot@users.noreply.github.com"
          git add -A
          git commit -m "Projekt aus ZIP entpackt"
          git push
