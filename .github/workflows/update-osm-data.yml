name: OSM-Daten aktualisieren

on:
  schedule:
    - cron: "17 3 1 * *"   # am 1. jedes Monats, 03:17 UTC
  workflow_dispatch:
    inputs:
      ohne_zuordnung:
        description: "Nur Standorte holen, ohne Ort/Gewässer/Extras (deutlich schneller, z. B. für den ersten Lauf)"
        type: boolean
        default: false
      bereich:
        description: "Region: DE = ganz Deutschland; zum Ausprobieren ein Bundesland, z. B. DE-NW (Achtung: überschreibt die Daten dann nur mit diesem Bundesland, daher nur zusammen mit „nur_pruefen“)"
        type: string
        default: "DE"
      nur_pruefen:
        description: "Nur abrufen und berichten, nichts übernehmen (Dry-Run)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # ganz Deutschland, Bundesland für Bundesland
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -I -m unittest discover -s tests -p "test_*.py"
      - name: Import aus OpenStreetMap
        env:
          PYTHONUNBUFFERED: "1"
          BEREICH: ${{ inputs.bereich || 'DE' }}
        run: python3 -u scripts/import_osm.py --area "$BEREICH" ${{ inputs.ohne_zuordnung && '--no-enrich' || '' }} ${{ inputs.nur_pruefen && '--dry-run' || '' }}
      - name: Daten prüfen
        run: python3 scripts/validate_data.py
      - name: Änderungen übernehmen
        run: |
          if [ -n "$(git status --porcelain public/data)" ]; then
            git config user.name "watermap-bot"
            git config user.email "watermap-bot@users.noreply.github.com"
            git add public/data/osm public/data/meta.json
            git commit -m "OSM-Daten aktualisiert ($(date -u +%F))"
            git push
          else
            echo "Keine Änderungen."
          fi
