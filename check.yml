name: Prüfung
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I -m unittest discover -s tests -p "test_*.py"
      - run: python3 scripts/validate_data.py
